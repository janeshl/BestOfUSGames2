<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find the Character</title>
  <link rel="stylesheet" href="styling.css" />
</head>
<body class="container">
  <h2 class="section-title">Find the Character — Player vs AI Detective</h2>
  <article class="card">
    <form id="start-form" class="game-form" autocomplete="off">
      <input name="topic" placeholder="Enter a topic (e.g., Marvel, Indian Cricket, Mythology)" required />
      <button class="btn" type="submit"><span>Start Battle</span></button>
    </form>

    <div id="game" style="display:none">
      <div class="battle-header">
        <div class="badge" id="rounds">Rounds left: 10</div>
      </div>

      <div class="battle-board">
        <section class="battle-box player-box">
          <div class="battle-title">👤 PLAYER</div>
          <div class="battle-subtitle">Your questions and your private answers</div>
          <div class="chat battle-chat" id="player-chat"></div>
          <form id="turn-form" class="game-form" autocomplete="off">
            <input id="userline" placeholder="Ask a question or make a guess..." required />
            <button class="btn" type="submit"><span>Ask</span></button>
          </form>
        </section>

        <section class="battle-box agent-box">
          <div class="battle-title">🤖 AI DETECTIVE</div>
          <div class="battle-subtitle" id="agent-status">Ready to investigate</div>
          <div class="agent-confidence-row"><span>Detective confidence</span><strong id="agent-confidence">0%</strong></div>
          <div class="agent-meter"><div id="agent-meter-fill"></div></div>
          <div class="chat battle-chat" id="agent-chat"></div>
          <div class="private-note">🔒 The agent's answers are private.</div>
        </section>
      </div>

      <div id="final-guess" style="display:none;margin-top:12px">
        <form id="final-guess-form" class="game-form" autocomplete="off">
          <input id="final-guess-input" placeholder="Round 10 final guess: who is the character?" required />
          <button class="btn" type="submit"><span>Submit Final Guess</span></button>
        </form>
      </div>
      <div id="result"></div>
    </div>
  </article>
  <div style="margin-top:24px;display:flex;justify-content:flex-start;"><a href="./games.html" class="back">← Back</a></div>
  <script src="script.js"></script>
</body>
</html>
